# Full stack: Postgres + controlplane + client-web.
#
#   cd deploy
#   cp .env.example .env    # edit passwords / image tags
#   docker login ghcr.io
#   docker compose --env-file .env up -d
#
# With host Docker sandboxes for agents:
#   docker compose --env-file .env -f compose.yaml -f compose.sandbox.yaml up -d
#
# UI: http://localhost:${HTTP_PORT:-8080}
# Tailscale: sudo tailscale serve --bg http://127.0.0.1:${HTTP_PORT:-8080}

name: agent-fabric

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agent}
      POSTGRES_DB: ${POSTGRES_DB:-agentfabric}
    volumes:
      - agentfabric_pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 5s
      retries: 10
    networks:
      - internal

  controlplane:
    image: ${CONTROLPLANE_IMAGE:-ghcr.io/tryy3/agent-fabric/controlplane:latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-agent}:${POSTGRES_PASSWORD:-agent}@postgres:5432/${POSTGRES_DB:-agentfabric}?sslmode=disable
    volumes:
      - controlplane_data:/app/data
      - type: bind
        source: ${SANDBOX_JSON:-./sandbox.json}
        target: /app/sandbox.json
        read_only: true
    networks:
      - internal

  client-web:
    image: ${CLIENT_WEB_IMAGE:-ghcr.io/tryy3/agent-fabric/client-web:latest}
    restart: unless-stopped
    depends_on:
      - controlplane
    ports:
      - "${HTTP_PORT:-8080}:80"
    environment:
      # nginx → plane on the Docker network
      CONTROLPLANE_UPSTREAM: http://controlplane:8080
      # Empty = same-origin from the browser (good with Tailscale Serve)
      CATALOG_BASE: ${CATALOG_BASE:-}
      ACP_URI: ${ACP_URI:-}
    networks:
      - internal

networks:
  internal:

volumes:
  agentfabric_pg:
  controlplane_data:
