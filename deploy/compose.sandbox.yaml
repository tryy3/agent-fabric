# Optional override: use the host Docker daemon for agent sandboxes.
# Requires a controlplane image that includes the docker CLI.
#
# Rootful Docker (system service):
#   DOCKER_SOCK=/var/run/docker.sock
#   DOCKER_GID=$(stat -c '%g' /var/run/docker.sock)
#
# Rootless Docker (dockerd-rootless) — REQUIRED if `ls` inside the container
# shows the sock as nobody:nobody while the host shows root:docker:
#   DOCKER_SOCK=$XDG_RUNTIME_DIR/docker.sock   # e.g. /run/user/1000/docker.sock
#   DOCKER_GID=$(stat -c '%g' "$DOCKER_SOCK")
#
#   docker compose --env-file .env -f compose.yaml -f compose.sandbox.yaml \
#     up -d --force-recreate controlplane
#
# Mount only the socket — not the host docker binary.

services:
  controlplane:
    user: "0:0"
    privileged: true
    userns_mode: host
    group_add:
      - ${DOCKER_GID:-999}
    security_opt:
      - apparmor:unconfined
      - label:disable
    environment:
      DOCKER_HOST: unix:///var/run/docker.sock
    volumes:
      - type: bind
        source: ${DOCKER_SOCK:-/var/run/docker.sock}
        target: /var/run/docker.sock
