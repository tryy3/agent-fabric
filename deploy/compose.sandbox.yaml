# Optional override: use the host Docker daemon for agent sandboxes.
# Requires a controlplane image that includes the docker CLI.
#
#   # Set DOCKER_GID to the host docker group (required on many hosts):
#   echo DOCKER_GID=$(getent group docker | cut -d: -f3) >> .env
#   docker compose --env-file .env -f compose.yaml -f compose.sandbox.yaml up -d
#
# Mount only the socket — not the host docker binary.
#
# `userns_mode: host` is required when Docker remaps container UIDs: otherwise
# user: "0:0" inside the container is NOT host root and gets EACCES on the sock.

services:
  controlplane:
    user: "0:0"
    userns_mode: host
    group_add:
      - ${DOCKER_GID:-999}
    volumes:
      - ${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock
