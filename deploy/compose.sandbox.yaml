# Optional override: use the host Docker daemon for agent sandboxes.
# Requires a controlplane image that includes the docker CLI.
#
#   echo "DOCKER_GID=$(stat -c '%g' /var/run/docker.sock)" >> .env
#   docker compose --env-file .env -f compose.yaml -f compose.sandbox.yaml up -d --force-recreate controlplane
#
# Mount only the socket — not the host docker binary.
#
# privileged + userns_mode:host is intentional: access to docker.sock is already
# equivalent to root on the host. group_add alone is not enough on many Ubuntu
# installs (AppArmor / userns / sock ownership).

services:
  controlplane:
    user: "0:0"
    privileged: true
    userns_mode: host
    group_add:
      # Prefer the sock's group (not always named "docker"):
      - ${DOCKER_GID:-999}
    security_opt:
      - apparmor:unconfined
      - label:disable
    volumes:
      - type: bind
        source: ${DOCKER_SOCK:-/var/run/docker.sock}
        target: /var/run/docker.sock
