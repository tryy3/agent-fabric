name: 🐛 Bug Report
description: Create a report to help us improve
title: "[Bug]: "
labels: ["type/fix"]
type: Bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to fill out this bug report!

  - type: checkboxes
    id: checklist
    attributes:
      label: Issue Checklist
      description: |
        Before submitting an issue, please make sure you have completed the following steps
      options:
        - label: I understand that issues are for feedback and problem solving, not for complaining in the comment section, and will provide as much information as possible to help solve the problem.
          required: true
        - label: I've looked at **pinned issues** and searched for existing [Open Issues](https://github.com/tryy3/agent-fabric/issues), [Closed Issues](https://github.com/tryy3/agent-fabric/issues?q=is%3Aissue%20state%3Aclosed), no similar issue was found.
          required: true
        - label: I've filled in short, clear headings so that developers can quickly identify a rough idea of what to expect when flipping through the list of issues. And not "a suggestion", "stuck", etc.
          required: true
        - label: I've confirmed that I am using a current build of Agent Fabric (recent `main` commit or GHCR image tag).
          required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: Where are you running the affected surface?
      options:
        - Web (Flutter client)
        - Linux
        - macOS
        - Windows
        - Docker / compose
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of the system is affected? This helps us apply the correct area label.
      multiple: true
      options:
        - Control plane
        - Client (Flutter)
        - Sandbox
        - Deploy / packaging
        - Documentation
        - CI / Build
        - Other / Unknown
    validations:
      required: true

  - type: dropdown
    id: impact
    attributes:
      label: Impact
      description: Does this bug have any of the following special impacts?
      multiple: true
      options:
        - Breaking change (existing setup stops working)
        - Security vulnerability
        - Operations / deployment concern
        - None of the above

  - type: input
    id: version
    attributes:
      label: Version
      description: What version, commit SHA, branch, or image tag are you running?
      placeholder: e.g. main@abc1234 or ghcr.io/tryy3/agent-fabric-controlplane:latest
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: Please be as detailed as possible when describing the problem. Please provide screenshots or screen recordings whenever possible to help us better understand the issue.
      placeholder: Tell us what happened... (Remember to attach screenshots/recordings if applicable)
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps To Reproduce
      description: Provide detailed steps to reproduce the issue so that our developers can reproduce the issue accurately. Please include screenshots or screen recordings for each step when possible.
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error

        Remember to attach screenshots/recordings for each step when possible!
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Log Output
      description: Please copy and paste any relevant log output
      render: shell

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Anything that gives us a better understanding of the problem you're experiencing
