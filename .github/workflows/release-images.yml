# Multi-arch images → GHCR via Docker GitHub Builder.
name: release-images

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: release-images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  controlplane:
    uses: docker/github-builder/.github/workflows/build.yml@v1
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      context: .
      file: controlplane/Dockerfile
      output: image
      push: ${{ github.event_name != 'pull_request' }}
      platforms: linux/amd64,linux/arm64
      sbom: true
      set-meta-labels: true
      set-meta-annotations: true
      cache: true
      cache-scope: controlplane
      job-name-prefix: controlplane
      meta-images: ghcr.io/${{ github.repository }}/controlplane
      meta-labels: |
        org.opencontainers.image.source=https://github.com/${{ github.repository }}
        org.opencontainers.image.revision=${{ github.sha }}
        org.opencontainers.image.licenses=AGPL-3.0-only
      meta-annotations: |
        org.opencontainers.image.source=https://github.com/${{ github.repository }}
        org.opencontainers.image.revision=${{ github.sha }}
        org.opencontainers.image.licenses=AGPL-3.0-only
      meta-tags: |
        type=ref,event=branch
        type=ref,event=pr
        type=semver,pattern={{version}}
        type=semver,pattern={{major}}.{{minor}}
        type=sha
        type=raw,value=latest,enable={{is_default_branch}}
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  client-web:
    uses: docker/github-builder/.github/workflows/build.yml@v1
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      context: .
      file: client/Dockerfile
      output: image
      push: ${{ github.event_name != 'pull_request' }}
      platforms: linux/amd64,linux/arm64
      sbom: true
      set-meta-labels: true
      set-meta-annotations: true
      cache: true
      cache-scope: client-web
      job-name-prefix: client-web
      meta-images: ghcr.io/${{ github.repository }}/client-web
      meta-labels: |
        org.opencontainers.image.source=https://github.com/${{ github.repository }}
        org.opencontainers.image.revision=${{ github.sha }}
        org.opencontainers.image.licenses=AGPL-3.0-only
      meta-annotations: |
        org.opencontainers.image.source=https://github.com/${{ github.repository }}
        org.opencontainers.image.revision=${{ github.sha }}
        org.opencontainers.image.licenses=AGPL-3.0-only
      meta-tags: |
        type=ref,event=branch
        type=ref,event=pr
        type=semver,pattern={{version}}
        type=semver,pattern={{major}}.{{minor}}
        type=sha
        type=raw,value=latest,enable={{is_default_branch}}
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
