# Control plane gate: gofmt only.
# Flutter client gates. Green CI proves format, analyze, and randomized tests.
# It does not prove on-device ACP/WebSocket behaviour or real-font layout.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-controlplane:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: controlplane/go.mod

      # Contract: gofmt is the sole Go formatting authority; -l names offenders.
      - name: gofmt
        working-directory: controlplane
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "Unformatted Go files (run gofmt -w):"
            echo "$out"
            exit 1
          fi

  verify-client:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: client
    steps:
      # VERIFY: confirm current majors before bumping blindly.
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.0'
          cache: true

      - run: flutter --version
      - run: flutter pub get

      # Contract: dart format is the sole whitespace authority.
      - run: dart format --output=none --set-exit-if-changed .

      # Contract: analyzer infos are failures (--fatal-infos).
      - run: flutter analyze --fatal-infos

      # Contract: randomized order surfaces inter-test state leakage.
      - run: flutter test --test-randomize-ordering-seed random --reporter expanded
