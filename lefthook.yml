# Git hooks via lefthook (https://lefthook.dev). Install once per clone:
#   lefthook install
# (also available in `nix develop` / direnv)

pre-commit:
  commands:
    dart-format:
      root: client/
      glob: "*.dart"
      run: dart format {staged_files}
      stage_fixed: true
    go-format:
      root: controlplane/
      glob: "*.go"
      run: gofmt -w {staged_files}
      stage_fixed: true

pre-push:
  parallel: true
  commands:
    go-vet:
      root: controlplane/
      glob: "*.go"
      run: go vet ./...
    sqlc-diff:
      root: controlplane/internal/db/
      run: sqlc diff
    flutter-analyze:
      root: client/
      glob: "*.dart"
      run: flutter analyze --fatal-infos
