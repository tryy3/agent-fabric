services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
      POSTGRES_DB: agentfabric
    ports:
      - "5432:5432"
    volumes:
      # Postgres 18+ stores data under /var/lib/postgresql/<major>/docker
      - agentfabric_pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agentfabric"]
      interval: 2s
      timeout: 5s
      retries: 10

volumes:
  agentfabric_pg:
